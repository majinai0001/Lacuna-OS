<html lang="ja">
<head>
<meta charset="utf-8">

<title>Lacuna OS</title>

<link rel="stylesheet" href="/fonts/zen-maru/500.css">
<link rel="stylesheet" href="/fonts/zen-maru/700.css">

<link rel="stylesheet" href="/fonts/jetbrains/500.css">

<style>
:root{--bg:#0e1013;--panel:#171a20;--line:#262b36;--win:#12151b;--title:#1c2029;--text:#d5d9e0;--mute:#8a93a3;--acc:#367bf0;--grid:#1b2230;--tint:#1a2433;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9ecf2;--panel:#f6f7fa;--line:#cfd4de;--win:#fff;--title:#eceff5;--text:#1b1f27;--mute:#5d6676;--grid:#dde2ec;--tint:#e1e8f5;color-scheme:light}}
:root[data-theme="light"]{--bg:#e9ecf2;--panel:#f6f7fa;--line:#cfd4de;--win:#fff;--title:#eceff5;--text:#1b1f27;--mute:#5d6676;--grid:#dde2ec;--tint:#e1e8f5;color-scheme:light}
:root[data-theme="dark"]{--bg:#0e1013;--panel:#171a20;--line:#262b36;--win:#12151b;--title:#1c2029;--text:#d5d9e0;--mute:#8a93a3;--grid:#1b2230;--tint:#1a2433;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:500 14px/1.5 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
button{font:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#desk{position:relative;height:100%;overflow:hidden}
#wall{position:absolute;inset:0;width:100%;height:100%}
.wg{fill:none;stroke:var(--grid)}
.wa{fill:none;stroke:var(--acc);stroke-width:2;opacity:.45}
#mark{position:absolute;right:16px;bottom:12px;font:700 clamp(28px,6vw,56px) "JetBrains Mono","Zen Maru Gothic","DejaVu Sans Mono",Menlo,monospace;letter-spacing:.12em;color:var(--grid);pointer-events:none}
#panel{position:absolute;left:0;right:0;top:0;height:44px;z-index:9999;display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line)}
#mb{width:44px;height:36px;border:0;border-radius:6px;background:var(--acc);color:#fff;display:grid;place-items:center;cursor:pointer}
#tasks{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto}
.tk{height:36px;padding:0 12px;border:0;border-bottom:2px solid transparent;border-radius:6px;background:var(--title);color:var(--text);white-space:nowrap;cursor:pointer}
.tk.on{border-bottom-color:var(--acc);background:var(--tint)}
.tk.min{color:var(--mute)}
#clk{color:var(--mute);padding-right:4px}
#menu{position:absolute;left:8px;top:48px;z-index:9998;min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px}
#menu[hidden]{display:none}
#menu button{display:flex;align-items:center;gap:10px;width:100%;height:44px;border:0;border-radius:6px;background:none;color:var(--text);padding:0 10px;text-align:left;cursor:pointer}
#menu button:hover{background:var(--title)}
#menu svg,.ic svg{width:22px;height:22px}
#icons{position:absolute;left:12px;top:56px;display:flex;flex-direction:column;gap:14px}
.ic{width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px;border:0;border-radius:8px;background:none;color:var(--text);font-size:12px;cursor:pointer}
.ic .g{width:52px;height:52px;border-radius:14px;background:var(--title);border:1px solid var(--line);display:grid;place-items:center}
.win{position:absolute;display:flex;flex-direction:column;background:var(--win);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 10px 36px rgba(0,0,0,.4)}
.win.act{border-color:var(--acc)}
.win.max{border-radius:0}
.win[hidden]{display:none}
.tb{height:40px;flex:none;display:flex;align-items:center;padding-left:12px;background:var(--title);touch-action:none;-webkit-user-select:none;user-select:none}
.tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.act .tt{color:var(--text)}
.tb button{width:40px;height:40px;border:0;background:none;color:var(--mute);display:grid;place-items:center;cursor:pointer}
.tb button:hover{color:var(--text)}
.tb svg{width:12px;height:12px}
.bd{flex:1;min-height:0;overflow:auto}
.rz{position:absolute;right:0;bottom:0;width:24px;height:24px;cursor:nwse-resize;touch-action:none}
.rz::after{content:"";position:absolute;right:5px;bottom:5px;width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute)}
.max .rz{display:none}
.term{padding:10px 12px;font:500 13px/1.6 "JetBrains Mono","Zen Maru Gothic","DejaVu Sans Mono",Menlo,monospace}
.term div{white-space:pre-wrap;word-break:break-all}
.term .pr{color:var(--acc)}
.term .dim{color:var(--mute)}
.ln{display:flex;gap:8px;align-items:center}
.ln input{flex:1;min-width:0;border:0;outline:0;background:none;color:inherit;font:inherit}
.bd textarea{display:block;box-sizing:border-box;width:100%;height:100%;padding:12px;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:inherit}
.ab{padding:16px;line-height:1.7}
.ab h1{margin:0 0 8px;font-size:18px}
.ab p{margin:0 0 8px}
#who{color:var(--mute);font-size:13px;white-space:nowrap}
#who.root{color:var(--text);font-weight:700;border-bottom:2px solid var(--acc)}
#desk.safe{background:#000}
.safe #wall,.safe #mark{display:none}
.rec #icons{display:none}
#boot{position:fixed;inset:0;z-index:20000;background:var(--bg);display:grid;place-items:center;overflow:auto;padding:16px;box-sizing:border-box}
#boot[hidden]{display:none}
.bx{width:min(92vw,360px);display:flex;flex-direction:column;gap:10px;text-align:center}
.bx h1{margin:0;font-size:22px}
.bx p{margin:0;color:var(--mute)}
.bx svg{align-self:center}
.bx button{min-height:48px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);cursor:pointer}
.bx button[type=submit],#rs{background:var(--acc);border-color:var(--acc);color:#fff}
.seg{display:flex;gap:8px}
.seg label{flex:1;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel);cursor:pointer}
.pw{display:flex;flex-direction:column;gap:4px;text-align:left}
.pw input{height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--panel);color:var(--text);font:inherit}
#le{min-height:1.5em;color:var(--text)}
.blog{width:min(92vw,460px);text-align:left;font:500 13px/1.8 "JetBrains Mono","Zen Maru Gothic","DejaVu Sans Mono",Menlo,monospace}
.blog .ok::first-line{color:#3fa66b}
.blog .warn::first-line{color:#d99a1e}
.ue{width:min(94vw,760px);display:flex;flex-direction:column;gap:10px}
.ue h1{margin:0;font-size:22px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{min-height:44px;padding:0 16px;border:0;border-bottom:3px solid transparent;background:none;color:var(--mute);white-space:nowrap;cursor:pointer}
.tabs button.on{color:var(--text);border-bottom-color:var(--acc)}
.up{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:4px 14px;min-height:240px;max-height:46vh;overflow:auto}
.up .dim{color:var(--mute);margin:8px 0}
.rw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rw:last-child{border-bottom:0}
.rw select,.rw button{min-height:40px;min-width:44px;border:1px solid var(--line);border-radius:6px;background:var(--win);color:var(--text);font:inherit;padding:0 10px}
.rw input[type=checkbox]{width:22px;height:22px}
#um{margin:0;min-height:1.5em;color:var(--text)}
.uf{display:flex;gap:8px;flex-wrap:wrap}
.uf button{flex:1;min-height:46px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);cursor:pointer}
.ue .pri{background:var(--acc);border-color:var(--acc);color:#fff}
#desk[data-wp=stars] .wg,#desk[data-wp=stars] .wa{display:none}
#desk:not([data-wp=stars]) .ws{display:none}
#desk[data-wp=plain] #wall{display:none}
.ws{fill:var(--mute)}
.stt{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 8px}
.stt button{min-height:44px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:none;color:var(--mute);cursor:pointer}
.stt button.on{color:var(--text);border-bottom-color:var(--acc)}
.stb{padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.stb fieldset{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0}
.stb legend{color:var(--mute);padding:0 6px}
.stb fieldset label{display:inline-flex;align-items:center;gap:6px;min-height:40px;margin-right:14px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw button[aria-pressed=true]{border-color:var(--text)}
.stb .r2{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stb select,.stb input[type=password],.stb button.sb{min-height:44px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);font:inherit;padding:0 10px}
.stb .pri{background:var(--acc);border-color:var(--acc);color:#fff;cursor:pointer}
.stb .pw{display:flex;flex-direction:column;gap:4px}
.stb .dim{color:var(--mute);margin:0}
#sm{min-height:1.5em;margin:0}

:root{--glass:rgba(23,26,32,.72);--r:12px;--ease:cubic-bezier(.2,.8,.2,1)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--glass:rgba(246,247,250,.78)}}
:root[data-theme="light"]{--glass:rgba(246,247,250,.78)}
:root[data-theme="dark"]{--glass:rgba(23,26,32,.72)}
#desk{background:var(--bg)}
#desk[data-wp=bloom]{background:radial-gradient(60% 55% at 78% 22%,color-mix(in srgb,var(--acc) 60%,transparent),transparent 70%),radial-gradient(55% 60% at 18% 85%,color-mix(in srgb,#7c3aed 45%,transparent),transparent 70%),var(--bg)}
#desk[data-wp=bloom] #wall,#desk[data-wp=plain] #wall{display:none}
#desk.safe[data-wp]{background:#000}
#desk.boot-in{animation:di .5s var(--ease)}
@keyframes di{from{opacity:0;transform:scale(1.03)}}
#boot{background:radial-gradient(55% 50% at 80% 15%,color-mix(in srgb,var(--acc) 45%,transparent),transparent 70%),radial-gradient(50% 55% at 15% 90%,color-mix(in srgb,#7c3aed 35%,transparent),transparent 70%),var(--bg)}
.bx{animation:fi .35s var(--ease)}
.bx.nf{animation:none}
@keyframes fi{from{opacity:0;transform:translateY(10px)}}
.fd{animation:fi .5s var(--ease)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:sp .8s linear infinite;align-self:center}
@keyframes sp{to{transform:rotate(360deg)}}
.bx>svg:first-child{animation:lp 2.4s ease-in-out infinite}
@keyframes lp{50%{opacity:.65;transform:scale(.95)}}
.lk{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;outline:0;transition:transform .3s var(--ease),opacity .3s;animation:fi .5s var(--ease)}
.lk.up{transform:translateY(-48px);opacity:0}
.lt{font-size:clamp(64px,20vw,120px);font-weight:500;line-height:1.05}
.ld{font-size:20px;color:var(--mute)}
.lk p{margin:24px 0 0;color:var(--mute)}
.seg label{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .2s,background .2s}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--acc);background:var(--tint)}
.av{width:52px;height:52px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:22px}
.oobe{width:min(92vw,420px)}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:all .25s var(--ease)}
.dots i.on{width:24px;border-radius:4px;background:var(--acc)}
.nv{display:flex;gap:10px}
.nv button{flex:1}
.cards{display:flex;gap:8px}
.cd{flex:1;min-height:56px;border:2px solid var(--line)!important;border-radius:12px;transition:transform .18s var(--ease),border-color .18s,background .18s}
.cd:hover{transform:translateY(-2px)}
.cd[aria-pressed=true]{border-color:var(--acc)!important;background:var(--tint)!important}
.oobe .sw{justify-content:center}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .45s var(--ease)}
#panel{top:auto;bottom:0;height:52px;justify-content:center;gap:6px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border-top:1px solid var(--line);border-bottom:0}
#tasks{flex:none;max-width:60vw}
#mb{width:44px;height:44px;background:none;color:var(--acc);border-radius:10px;transition:background .15s,transform .15s var(--ease)}
#mb:hover{background:var(--title)}
#mb:active{transform:scale(.9)}
.tk{position:relative;width:44px;height:44px;padding:0;display:grid;place-items:center;background:none;border:0;border-radius:10px;transition:background .15s,transform .15s var(--ease)}
.tk:hover{background:var(--title)}
.tk:active{transform:scale(.9)}
.tk svg{width:22px;height:22px}
.tk::after{content:"";position:absolute;bottom:3px;left:50%;width:6px;height:3px;border-radius:2px;background:var(--mute);transform:translateX(-50%);transition:width .2s var(--ease),background .2s}
.tk.on::after{width:18px;background:var(--acc)}
.tk.min{opacity:.7}
#tray{position:absolute;right:12px;display:flex;gap:12px;align-items:center;font-size:12px;line-height:1.25;text-align:right;color:var(--text)}
#icons{top:16px}
.ic .g{transition:transform .18s var(--ease),background .18s}
.ic:hover .g{transform:translateY(-2px);background:var(--panel)}
.ic:active .g{transform:scale(.94)}
.ic{text-shadow:0 1px 3px rgba(0,0,0,.5)}
.win{border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.28);animation:wi .22s var(--ease);transition:box-shadow .2s,border-color .2s}
.win.act{box-shadow:0 18px 48px rgba(0,0,0,.5);border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.win.tr{transition:left .24s var(--ease),top .24s var(--ease),width .24s var(--ease),height .24s var(--ease),border-radius .24s}
.win.out{animation:wo .16s ease-in forwards}
.win.mn{animation:wm .18s ease-in forwards}
.win.rs{animation:wr .22s var(--ease)}
@keyframes wi{from{opacity:0;transform:scale(.94) translateY(8px)}}
@keyframes wo{to{opacity:0;transform:scale(.95)}}
@keyframes wm{to{opacity:0;transform:translateY(70px) scale(.8)}}
@keyframes wr{from{opacity:0;transform:translateY(50px) scale(.88)}}
.tb button{transition:background .15s,color .15s}
.tb button:hover{background:var(--panel)}
.tb button[data-a=x]:hover{background:#c42b1c;color:#fff}
#menu{left:50%;bottom:64px;top:auto;width:min(92vw,420px);min-width:0;padding:16px;border-radius:16px;background:var(--glass);backdrop-filter:blur(28px) saturate(1.4);-webkit-backdrop-filter:blur(28px) saturate(1.4);box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:12px;transform:translateX(-50%);animation:mi .22s var(--ease)}
#menu[hidden]{display:none}
@keyframes mi{from{opacity:0;transform:translateX(-50%) translateY(18px) scale(.97)}}
#menu [hidden]{display:none!important}
#menu .ms{height:40px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 16px;font:inherit}
#menu .mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#menu .mg button{width:auto;height:auto;flex-direction:column;justify-content:center;gap:6px;padding:12px 4px;font-size:12px;text-align:center;border-radius:10px}
#menu .mf{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
#menu .mf button{width:auto;height:40px;padding:0 12px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

:root{--wp-aurora:url(assets/wp/aurora.webp);--wp-dusk:url(assets/wp/dusk.webp);--wp-forest:url(assets/wp/forest.webp);--wp-paper:url(assets/wp/paper.webp)}
#wall,#mark{display:none}
#desk[data-wp=aurora]{background:var(--wp-aurora) center/cover,var(--bg)}
#desk[data-wp=dusk]{background:var(--wp-dusk) center/cover,var(--bg)}
#desk[data-wp=forest]{background:var(--wp-forest) center/cover,var(--bg)}
#desk[data-wp=paper]{background:var(--wp-paper) center/cover,var(--bg)}
#desk.safe[data-wp]{background:#000}
#boot{background:linear-gradient(color-mix(in srgb,var(--bg) 35%,transparent),color-mix(in srgb,var(--bg) 35%,transparent)),var(--wp-aurora) center/cover,var(--bg)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) #boot{background:var(--wp-paper) center/cover,var(--bg)}}
:root[data-theme="light"] #boot{background:var(--wp-paper) center/cover,var(--bg)}
.ic .g{background:none!important;border:0!important;width:56px;height:56px}
.ic .g img{width:56px;height:56px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.ic{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
#desk[data-wp=paper] .ic{color:#1b1f27;text-shadow:0 1px 2px rgba(255,255,255,.8)}
#desk[data-wp=plain] .ic{color:var(--text);text-shadow:none}
.tk img{width:28px;height:28px}
#menu .mg img{width:40px;height:40px}
.ti{width:18px;height:18px;margin-right:8px}
.bx>img:first-child{align-self:center;animation:lp 2.4s ease-in-out infinite}
.wpb{background-size:cover;background-position:center}

:root{--bg:#202020;--panel:#2b2b2b;--win:#202020;--title:#202020;--line:#3a3a3a;--text:#ffffff;--mute:#b8b8b8;--glass:rgba(32,32,32,.85);--ctl:rgba(255,255,255,.06);--ctlh:rgba(255,255,255,.09);--ctlp:rgba(255,255,255,.04);--cb:rgba(255,255,255,.09);--wb:rgba(255,255,255,.14);--tint:color-mix(in srgb,var(--acc) 22%,#202020)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f3f3;--panel:#fbfbfb;--win:#f3f3f3;--title:#f3f3f3;--line:#e3e3e3;--text:#1a1a1a;--mute:#5c5c5c;--glass:rgba(243,243,243,.85);--ctl:#fbfbfb;--ctlh:#f6f6f6;--ctlp:#f5f5f5;--cb:rgba(0,0,0,.1);--wb:rgba(0,0,0,.18);--tint:color-mix(in srgb,var(--acc) 14%,#f3f3f3)}}
:root[data-theme="light"]{--bg:#f3f3f3;--panel:#fbfbfb;--win:#f3f3f3;--title:#f3f3f3;--line:#e3e3e3;--text:#1a1a1a;--mute:#5c5c5c;--glass:rgba(243,243,243,.85);--ctl:#fbfbfb;--ctlh:#f6f6f6;--ctlp:#f5f5f5;--cb:rgba(0,0,0,.1);--wb:rgba(0,0,0,.18);--tint:color-mix(in srgb,var(--acc) 14%,#f3f3f3)}
:root[data-theme="dark"]{--bg:#202020;--panel:#2b2b2b;--win:#202020;--title:#202020;--line:#3a3a3a;--text:#ffffff;--mute:#b8b8b8;--glass:rgba(32,32,32,.85);--ctl:rgba(255,255,255,.06);--ctlh:rgba(255,255,255,.09);--ctlp:rgba(255,255,255,.04);--cb:rgba(255,255,255,.09);--wb:rgba(255,255,255,.14);--tint:color-mix(in srgb,var(--acc) 22%,#202020)}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--mute) 55%,transparent) transparent}
.bx button,.uf button,.rw button,.stb .sb,.fly button{background:var(--ctl);border:1px solid var(--cb);border-radius:4px;min-height:40px;color:var(--text);font:inherit}
.bx button:hover,.uf button:hover,.rw button:hover,.stb .sb:hover{background:var(--ctlh)}
.bx button:active,.uf button:active,.rw button:active,.stb .sb:active{background:var(--ctlp)}

async function ok(u,p){return !!(await verify(u,p));}

function norm(p,S){if(p==='~'||p.indexOf('~/')===0)p=home(S.user)+p.slice(1);var o=[];(p.charAt(0)==='/'?p:S.cwd+'/'+p).split('/').forEach(function(x){if(!x||x==='.')return;if(x==='..')o.pop();else o.push(x);});return o;}

/* ---- ナビゲーション ---- */
var INT={newtab:'新しいタブ',settings:'設定',history:'履歴',bookmarks:'ブックマーク'};
function nav(t,v,push){
v=(v||'').trim();
var m=/^lacuna:\/\/(newtab|settings|history|bookmarks)$/.exec(v);
if(m){t.int=m[1];t.title=INT[m[1]];}
else{
var u=toUrl(v);if(!u)return;
t.int=null;t.url=u;t.title=u.replace(/^https?:\/\//,'');t.pend=true;
if(push!==false){t.stack.splice(t.i+1);t.stack.push(u);t.i=t.stack.length-1;}
t.frame.go(u);
}
if(t===cur)refresh();else tabbar();
}
function onUrl(t,u){
try{if(u.indexOf(location.origin)===0)u=scram.decodeUrl(u);}catch(x){}
if(t.pend){t.pend=false;t.stack[t.i]=u;}
else if(u!==t.stack[t.i]){t.stack.splice(t.i+1);t.stack.push(u);t.i=t.stack.length-1;}
t.url=u;if(t===cur&&!t.int)refresh();
}
function onLoad(t){
try{var d=t.iframe.contentDocument;if(d&&d.title)t.title=d.title;}catch(e){}
if(BP.keepHist&&t.url&&!t.int&&!(BP.hist[0]&&BP.hist[0].u===t.url)){BP.hist.unshift({t:t.title,u:t.url,at:Date.now()});if(BP.hist.length>200)BP.hist.length=200;save();}
tabbar();if(t===cur)dirty();
}
function newTab(u){
if(!ready||tabs.length>=8)return;
var t={id:++tid,url:'',title:'新しいタブ',int:null,stack:[],i:-1,pend:false};
t.iframe=mk('iframe');t.iframe.title='ページ';t.iframe.hidden=true;t.iframe.setAttribute('allow','fullscreen');
bm.appendChild(t.iframe);
t.frame=scram.createFrame(t.iframe);
t.frame.addEventListener('urlchange',function(e){onUrl(t,e.url);});
t.frame.addEventListener('contextInit',function(e){hook(t,e.window);});
t.iframe.addEventListener('load',function(){onLoad(t);});

}
function pick(t){cur=t;refresh();}
function closeTab(t){
var i=tabs.indexOf(t);tabs.splice(i,1);t.iframe.remove();
if(!tabs.length){newTab('lacuna://newtab');return;}
if(cur===t)cur=tabs[Math.min(i,tabs.length-1)];

function goBack(){
if(!cur||!ready)return;
if(cur.int){if(cur.stack.length){cur.int=null;refresh();}return;}
if(cur.i>0){cur.i--;nav(cur,cur.stack[cur.i],false);}
}
function goFwd(){
if(!cur||!ready)return;
if(cur.int){if(cur.stack.length){cur.int=null;refresh();}return;}
if(cur.i<cur.stack.length-1){cur.i++;nav(cur,cur.stack[cur.i],false);}
}
function reload(){if(!cur||!ready)return;if(cur.int){refresh();return;}if(cur.stack[cur.i])nav(cur,cur.stack[cur.i],false);}

function fmt(x){if(typeof x==='string')return x;var s;try{s=JSON.stringify(x);}catch(e){}return s===undefined?String(x):s;}
function clog(k,t){logs.push({k:k,t:t});if(logs.length>300)logs.shift();dirty();}
function hook(t,w){
try{
if(!w||w.__lh)return;w.__lh=1;
['log','info','warn','error','debug'].forEach(function(k){var o=w.console[k];w.console[k]=function(){clog(k,[].slice.call(arguments).map(fmt).join(' '));return o.apply(w.console,arguments);};});

w.addEventListener('unhandledrejection',function(e){clog('error','Unhandled: '+(e.reason&&e.reason.message||e.reason));});
}catch(x){}
}

e.preventDefault();var i=dv.querySelector('.dvi input'),c=i.value;i.value='';if(!c.trim())return;

try{
var r=await fetch('/api/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:pw.value})});
var j=await r.json();
if(j.ok){start();}else{er.textContent=j.error||'解除できませんでした';pw.value='';}
}catch(x){er.textContent='通信に失敗しました';}
});
}
async function start(){
msg('接続を準備しています...');
try{
var st=await sessionState();
if(st==='none'){msg('このページでは、ブラウザを使えません。ブラウザは、Renderなどに載せたサーバー版のLacuna OSで動きます。');return;}
if(st==='locked'){unlock();return;}
await initProxy();
ready=true;swPost({type:'shields',on:BP.shields});
newTab(BP.home);if(BP.dev)devOpen(true);
}catch(e){msg('起動に失敗しました: '+e.message,[['もう一度試す',start]]);}
}
tabbar();start();
}

if(k==='sb'){D.sbHash=D.sb?await imageHash():'';msg=D.sb?'現在のOSイメージを登録しました':'Secure Bootを無効にしました';}
draw();
}
draw();
}
async function boot(m){
if(m==='reset'){bootReset();return;}
session.mode=m;
if(uefi.sb&&(await imageHash())!==uefi.sbHash){
bootEl.innerHTML='<div class="bx">'+LOGO+'<h1>Secure Boot 違反</h1><p>OSイメージが、登録されたものと違います。UEFI設定で、現在のイメージを登録し直してください。</p><button id="v1" type="button">UEFI設定へ</button><button id="v2" type="button">電源を入れ直す</button></div>';
document.getElementById('v1').addEventListener('click',enterUefi);
document.getElementById('v2').addEventListener('click',power);
return;
}
var fast=RM||uefi.fast;
if(uefi.quiet){
bootEl.innerHTML='<div class="bx">'+LOGO+'<div class="spin" role="status" aria-label="起動中"></div></div>';
await metaReady;await sl(fast?0:400);
}else{
bootEl.innerHTML='<div class="bx blog" id="bl"></div>';
var bl=document.getElementById('bl');
var L=[['ok','カーネルを起動しています'],['ok','ファイルシステムを確認しています'],['ok','ユーザー情報を確認しています']];
if(m==='safe')L.push(['warn','Safe mode: 壁紙と追加アプリを読み込みません']);
if(m==='recovery')L.push(['warn','Recovery: rootのパスワードが必要です']);
if(uefi.sb)L.push(['ok','Secure Boot: OSイメージを検証しました']);
L.push(['ok','ログイン画面を準備しています']);
for(var i=0;i<L.length;i++){
var d=document.createElement('div');
d.className=L[i][0];d.textContent=(L[i][0]==='ok'?'[ OK ] ':'[ !! ] ')+L[i][1];
bl.appendChild(d);
if(i===1)await metaReady;
await sl(fast?0:160);
}
}
if(!meta)setup();else if(m==='recovery')login();else lock();
}
function login(){
bootEl.hidden=false;
var rec=session.mode==='recovery';
bootEl.innerHTML='<form class="bx" id="lf">'+LOGO+'<h1>'+(rec?'Recovery: rootでログイン':'ログイン')+'</h1><div class="seg" role="radiogroup" aria-label="ユーザー">'+(rec?'':'<label><input type="radio" name="u" value="user" checked><span class="av">U</span>user</label>')+'<label><input type="radio" name="u" value="root"'+(rec?' checked':'')+'><span class="av">R</span>root</label></div><label class="pw"><span>パスワード</span><input type="password" id="lp" autocomplete="off"></label><p id="le" role="alert"></p><button type="submit">ログイン</button><button type="button" id="lb">起動メニューに戻る</button></form>';
var pw=document.getElementById('lp'),le=document.getElementById('le');
document.getElementById('lb').addEventListener('click',bootMenu);
document.getElementById('lf').addEventListener('submit',async function(e){
e.preventDefault();
var u=bootEl.querySelector('input[name=u]:checked').value;
le.textContent='確認中...';
try{
var raw=await verify(u,pw.value);
if(!raw){le.textContent='ユーザーまたはパスワードが違います';pw.value='';pw.focus();return;}
dkRaw=raw;dk=await importDk(raw);await loadFs();
session.user=u;pw.value='';startDesktop();
}catch(x){le.textContent=x.message;pw.value='';}
});
pw.focus();
}
var idleT=null;
function idle(){clearTimeout(idleT);var m=uefi.idle;if(bootEl.hidden&&m)idleT=setTimeout(function(){if(bootEl.hidden)logout();},m*60000);}
['pointerdown','keydown'].forEach(function(ev){document.addEventListener(ev,idle,true);});
mb.addEventListener('click',function(){var f0=menu.querySelector('.fly');if(f0)f0.hidden=true;menu.hidden=!menu.hidden;mb.setAttribute('aria-expanded',String(!menu.hidden));});
document.addEventListener('pointerdown',function(e){if(!e.target.closest('#menu,#mb')){menu.hidden=true;mb.setAttribute('aria-expanded','false');}});
function tick(){document.getElementById('clk').textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});}
tick();setInterval(tick,15000);
power();
})();
</script>

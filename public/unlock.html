<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>合言葉</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e1013;color:#d5d9e0;font:16px system-ui,sans-serif}form{display:flex;flex-direction:column;gap:10px;width:min(90vw,320px)}input,button{height:46px;border-radius:8px;border:1px solid #262b36;font:inherit;padding:0 12px}input{background:#171a20;color:inherit}button{background:#367bf0;color:#fff;border-color:#367bf0}p{min-height:1.4em;margin:0}</style></head>
<body><form id="f"><h1 style="margin:0;font-size:20px">合言葉</h1><input id="p" type="password" aria-label="合言葉" autocomplete="off"><button>解除する</button><p id="m" role="alert"></p></form>
<script>
document.getElementById('f').addEventListener('submit',async function(e){e.preventDefault();var m=document.getElementById('m');
try{var r=await fetch('/api/unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pass:document.getElementById('p').value})});var j=await r.json();
m.textContent=j.ok?'解除しました。ブラウザアプリが使えます。':j.error;}catch(x){m.textContent='通信に失敗しました';}});
</script></body></html>
